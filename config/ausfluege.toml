fahrzeit_min = 5
bedingung = ["jedes_wetter", "nordwind"]
dauer = "kurz"
hund = "unklar"
beschreibung = "Minho-Mündung mit Blick auf das Ínsua-Fort. Bei Nordwind teils im Wald geschützt. Passt bei jedem Wetter außer Starkregen."

