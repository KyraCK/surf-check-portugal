# =====================================================================
#  AUSFLÜGE · Surf-Check Portugal
# =====================================================================
#
#  Die Seite schlägt pro Tag ein bis zwei Ausflüge vor, abhängig von
#  Wetter und Wind. Jedes Ziel gehört zu einer Basis (id aus spots.toml).
#
#  EIN ZIEL HINZUFÜGEN: Block "[[ausfluege]]" kopieren und ändern.
#
#  FELDER
#  ------
#    basis          id der Basis, zu der das Ziel gehört
#    name           Name des Ziels
#    symbol         Symbol auf der Seite: mountain, castle, swim, trail, tree, lighthouse, city
#    fahrzeit_min   Fahrzeit in Minuten, eine Zahl (30) oder ein Bereich ([30, 40]).
#                   Alle Angaben sind Schätzungen.
#    bedingung      Wann das Ziel passt (eine oder mehrere):
#                     jedes_wetter  passt bei jedem Wetter außer Starkregen
#                     nordwind      geschützt oder trotzdem gut bei starkem Nordwind
#                     regen         eine Alternative bei Regen
#                     warm_ruhig    schön bei warmem, ruhigem Wetter (Baden, Wandern)
#                     klar          braucht trockenes, klares Wetter
#    dauer          kurz (bis etwa 2 Stunden), halbtag oder ganztag
#    hund           erlaubt_leine (belegt) oder unklar (nicht belegt)
#    beschreibung   ein bis zwei Sätze
#    quelle         Link (optional)
#
#  SO WÄHLT DIE SEITE AUS (Zahlen stehen unten bei [regeln])
#  ---------------------------------------------------------
#    * Bei Regen über der Grenze: nur Ziele mit "regen".
#    * Bei starkem Nordwind: nur Ziele mit "nordwind".
#    * Bei warmem Wetter ohne Wind: Ziele mit "warm_ruhig" (Baden, Wandern) zuerst.
#    * An Surftagen (ein Fenster mit Score ab surftag_ab_punkte für mindestens
#      eine Person): nur kurze Ziele, als Nachmittagstipp.
# =====================================================================

[regeln]
nordwind_ab_kn        = 15          # ab dieser Windstärke gilt Nordwind als stark
nordwind_sektor_grad  = [315, 45]   # Wind aus diesem Bereich zählt als Nordwind
regen_ab_prozent      = 50          # ab dieser Regenwahrscheinlichkeit gilt es als Regentag
starkregen_ab_prozent = 80          # darüber fällt auch "jedes_wetter" weg
warm_ab_c             = 18          # ab dieser Temperatur gilt es als warm
ruhig_bis_kn          = 8           # unter dieser Windstärke gilt es als ruhig
klar_regen_unter_prozent  = 30      # "klar" braucht weniger Regenwahrscheinlichkeit als das
klar_wolken_unter_prozent = 70      # und weniger Bewölkung als das
vorschlaege_pro_tag   = 2


# =====================================================================
#  BASIS CAMINHA (Hunderegeln meist nicht belegt, Leine annehmen)
# =====================================================================

[[ausfluege]]
basis = "caminha"
name = "Foz do Minho / Mata do Camarido"
