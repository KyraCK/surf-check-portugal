swell_dir_deg = [207, 332]
# Ablandiger Wind: Nordost, Ost, Südost.
wind_dir_deg  = [36, 144]
tide  = "mittel"
boden     = "Sand"
wellentyp = "Beachbreak, Lefts und Rights"
niveau    = "Intermediate (SF), alle Level (MS)"
# Ab dieser Wellenhöhe läuft der Spot (MS: etwa 0,6 m). Es gibt keine
# Angabe, bis wohin er geht, deshalb steht hier kein groesse_max_m.
groesse_min_m = 0.6
korrekturfaktor = 1.0
notizen = """
Gefährliche Rips (SF). Felsen beim Ein- und Ausstieg (MS).
Erster Messpunkt 7.10.2026: Modelle 0,66 bis 0,88 m, vor Ort deutlich unter 1 m.
Zweiter Messpunkt 7.10.2026 gegen 13 Uhr (Webcam, nur Schätzung): Modelle 0,9 bis 1,2 m am Spot, geschätzt etwa 0,9 m oder etwas weniger. Der eigentliche Spot liegt weiter draußen Richtung der Festung im Meer. Moledo ist exponierter und wirkt weniger glatt als andere Spots in der Nähe.
Faktor bleibt vorerst 1.0, erst nach zwei oder drei weiteren Vergleichen anpassen.
Windguru-Station Moledo: 48935.
"""
quellen = [
  "https://www.surf-forecast.com/breaks/Moledo",
  "https://mondo.surf/surf-spot/praia-de-moledo/guide/5101",
]
webcams = ["https://www.surf-forecast.com/breaks/Moledo/webcams/latest"]
vergleich = [
  "https://www.windguru.cz/48935",
  "https://www.surf-forecast.com/breaks/Moledo/forecasts/latest",
]
unsicher = """
Tide: Die Quellen widersprechen sich. SF: um Hochwasser. MS: Niedrigwasser mit auflaufendem Wasser. Für den Score steht hier der mittlere Wert "mittel".
Swell: MS gibt 207 bis 332 Grad an, SF nur West. Für den Score gilt der breitere MS-Bereich.
"""


