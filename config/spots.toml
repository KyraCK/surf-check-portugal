# =====================================================================
#  BASEN UND SPOTS · Surf-Check Portugal
# =====================================================================
#
#  Eine BASIS ist der Ort, an dem ihr gerade wohnt (mit Zeitraum).
#  Jede Basis hat eine Liste von Spots. Die Seite zeigt automatisch die
#  Basis, die heute gilt, und bietet einen Umschalter für die anderen.
#
#  EINEN SPOT HINZUFÜGEN
#  ---------------------
#  1. Kopiere einen kompletten Block "[spots.xyz]" weiter unten.
#  2. Gib ihm einen neuen, kurzen Namen ohne Leerzeichen und Umlaute
#     (z. B. [spots.ofir]).
#  3. Ändere die Werte.
#  4. Trage den Namen (ohne "spots.") in die Liste "spots" der passenden
#     Basis ein.
#
#  Felder, zu denen es keine belegte Angabe gibt, lässt du einfach weg.
#  Die Seite zeigt dann einen Strich statt eines erfundenen Werts.
#
#  ABKÜRZUNGEN IN DEN QUELLEN: SF = surf-forecast.com, MS = mondo.surf,
#  SA = thesurfatlas.com.
#
#  RICHTUNGEN sind Gradzahlen: 0 = Nord, 90 = Ost, 180 = Süd, 270 = West.
#  Bei Wind und Swell ist immer die Richtung gemeint, AUS der er kommt.
#  Ein Bereich [von, bis] läuft im Uhrzeigersinn und darf über Nord
#  gehen, zum Beispiel [319, 98] für Nordwest über Nord bis Ost.
#  Nennt eine Quelle nur Himmelsrichtungen, steht hier der 45-Grad-
#  Sektor um diese Richtung (West = 247 bis 292), und im Feld "unsicher"
#  steht ein Hinweis.
#
#  FELDER PRO SPOT
#  ---------------
#    name, lat, lon          Name und Koordinaten (Dezimalgrad, West ist minus)
#    swell_dir_deg           Swell-Richtung [von, bis]
#    wind_dir_deg            ablandiger Wind [von, bis]
#    tide                    niedrig, niedrig_mittel, mittel, mittel_hoch, hoch, alle
#                            (ohne Zeile: keine Tide-Wirkung)
#    boden, wellentyp, niveau  nur zur Information
#    groesse_min_m           darunter läuft der Spot nicht (Wellenhöhe am Spot)
#    groesse_max_m           darüber wird er zu schwierig oder unruhig
#    korrekturfaktor         Modellhöhe mal Faktor = Höhe der brechenden Welle am Spot
#    ausweich                true = weiter weg, nur im Fazit, wenn deutlich besser
#    fahrzeit_min            geschätzte Fahrzeit von der Basis (nur wenn belegt)
#    notizen, unsicher       Freitext (unsicher = Quellen widersprechen sich)
#    quellen, webcams, vergleich   Links (nur Links, nichts wird ausgelesen)
# =====================================================================


# ---------------------------------------------------------------------
#  BASEN
# ---------------------------------------------------------------------
# Messstationen (pegel, ipma_*) liefern gemessene Gezeiten, Wassertemperatur
# und Warnungen. Die Zuordnung ist hier einmal festgelegt.

